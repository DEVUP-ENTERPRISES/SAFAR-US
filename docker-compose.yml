# Production-shaped compose: builds both images, wires health checks, and keeps
# the frontend from starting until the API is genuinely ready.
#
#   cp backend/.env.example backend/.env   # fill in real values first
#   docker compose up --build
#
# Secrets come from backend/.env (gitignored, and excluded from the build
# context by .dockerignore) — they are injected at RUN time, never baked in.
services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      - '8080:8080'
    restart: unless-stopped
    healthcheck:
      # /system/ready 503s when Mongo or Redis is unreachable, so this reflects
      # "can actually serve traffic", not merely "process is alive".
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/api/v1/system/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  web:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time — they
        # must be build args. Passing them only as runtime env leaves them
        # undefined in the browser.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-CATO}
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
    ports:
      - '3000:3000'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
