# Continuous integration — the gate every commit passes before it can ship.
#
# Runs on every push and pull request. Nothing reaches production that has not
# been linted, type-checked, tested and built here first, so a deploy is always
# traceable to a green commit rather than a manual copy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The jest suite is pure logic — it never connects to Mongo or Redis — but
      # importing config validates the environment and exits if required vars are
      # missing. CI has no .env, so provide throwaway values that satisfy the
      # schema. NODE_ENV=test skips the production guards. DB-backed checks run
      # against a real database outside CI.
      - run: npm test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/cato_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci_test_access_secret_0123456789abcdef
          JWT_REFRESH_SECRET: ci_test_refresh_secret_fedcba9876543210
      - run: npm run build

  frontend:
    name: Frontend — typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # No lint step: the frontend has no ESLint config (next lint is
      # interactive and deprecated). typecheck + build are the real gates.
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_APP_NAME: CATO

  admin-web:
    name: Admin app — typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The admin app compiles shared source from ../frontend/src, so the public
      # app's dependencies must be present for those files to resolve.
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: admin-web
      - run: npm run typecheck
        working-directory: admin-web
      - run: npm run build
        working-directory: admin-web
        env:
          NEXT_PUBLIC_ADMIN_SLUG: ci-build-slug

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fail the build on a CRITICAL advisory. Not "high", deliberately: the one
      # known high is a build-time PostCSS issue reachable only through a Next
      # major upgrade, tracked separately — blocking every deploy on it would
      # stop the pipeline doing its actual job. New criticals still hard-fail.
      - run: npm audit --audit-level=critical
        working-directory: backend
      - run: npm audit --audit-level=critical
        working-directory: frontend
